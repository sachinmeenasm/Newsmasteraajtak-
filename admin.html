<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NEWSMASTER Admin</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f3f3f3;
  color:#222;
}

.header{
  background:#111;
  color:white;
  padding:18px;
  text-align:center;
}

.header b{
  color:#e31824;
}

.panel{
  max-width:700px;
  margin:25px auto;
  padding:25px;
  background:white;
  border-radius:15px;
  box-shadow:0 3px 15px #0002;
}

h2{
  margin-top:0;
  border-left:5px solid #e31824;
  padding-left:10px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#e31824;
  color:white;
  font-size:17px;
  font-weight:bold;
}

button.logout{
  background:#333;
}

#loginPanel{
  max-width:500px;
}

#adminPanel{
  display:none;
}

#preview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:cover;
  margin-top:15px;
  border-radius:10px;
}

#status,
#loginStatus{
  margin-top:15px;
  font-weight:bold;
  text-align:center;
}

.success{
  color:green;
}

.error{
  color:#e31824;
}
</style>
</head>

<body>

<header class="header">
  <h1><b>NEWS</b>MASTER</h1>
  <p>Admin Panel 🔐</p>
</header>


<!-- LOGIN -->

<div class="panel" id="loginPanel">

  <h2>🔐 Admin Login</h2>

  <label>Email</label>

  <input
    type="email"
    id="loginEmail"
    placeholder="Admin Email">


  <label>Password</label>

  <input
    type="password"
    id="loginPassword"
    placeholder="Admin Password">


  <button onclick="loginAdmin()">
    🔐 Login
  </button>

  <p id="loginStatus"></p>

</div>


<!-- ADMIN PANEL -->

<div class="panel" id="adminPanel">

  <h2>📰 नई खबर जोड़ें</h2>

  <label>खबर की Headline</label>

  <input
    type="text"
    id="title"
    placeholder="खबर की headline लिखें">


  <label>Category</label>

  <select id="category">

    <option value="भारत">भारत</option>
    <option value="दुनिया">दुनिया</option>
    <option value="राजनीति">राजनीति</option>
    <option value="बिजनेस">बिजनेस</option>
    <option value="टेक्नोलॉजी">टेक्नोलॉजी</option>
    <option value="स्पोर्ट्स">स्पोर्ट्स</option>
    <option value="मनोरंजन">मनोरंजन</option>

  </select>


  <label>खबर की पूरी जानकारी</label>

  <textarea
    id="description"
    placeholder="खबर की पूरी जानकारी लिखें">
  </textarea>


  <label>News Photo</label>

  <input
    type="file"
    id="newsPhoto"
    accept="image/*">


  <img
    id="preview"
    alt="Photo Preview">


  <button onclick="uploadNews()">
    📤 खबर Publish करें
  </button>

<hr style="margin:35px 0">

<h2>📋 सभी खबरें Manage करें</h2>

<button onclick="loadNews()">
  🔄 News List Refresh करें
</button>

<div id="newsList"></div>
  <p id="status"></p>


  <button
    class="logout"
    onclick="logoutAdmin()">
    🚪 Logout
  </button>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zdupxbndazidvwrfvrhd.supabase.co";


/*
  यहाँ आपकी Publishable Key रहेगी।
  Secret / Service Role key बिल्कुल नहीं डालनी।
*/

const SUPABASE_KEY =
"sb_publishable_NSWujieJHbKrNORTwJa9oQ_HJvaqZdq";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);



/* =========================
   CHECK LOGIN
========================= */

async function checkLogin(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(session){

    showAdmin();

  }else{

    showLogin();

  }

}



/* =========================
   SHOW LOGIN
========================= */

function showLogin(){

  document.getElementById("loginPanel")
    .style.display="block";

  document.getElementById("adminPanel")
    .style.display="none";

}



/* =========================
   SHOW ADMIN
========================= */

function showAdmin(){

  document.getElementById("loginPanel")
    .style.display="none";

  document.getElementById("adminPanel")
    .style.display="block";

}



/* =========================
   LOGIN
========================= */

async function loginAdmin(){

  const email =
    document.getElementById("loginEmail")
    .value.trim();

  const password =
    document.getElementById("loginPassword")
    .value;

  const status =
    document.getElementById("loginStatus");


  if(!email || !password){

    status.innerText =
      "⚠️ Email और Password डालें।";

    status.className="error";

    return;

  }


  status.innerText =
    "⏳ Login हो रहा है...";


  const {
    data,
    error
  } =
  await supabaseClient.auth
  .signInWithPassword({

    email:email,
    password:password

  });


  if(error){

    status.innerText =
      "❌ Login failed: "
      + error.message;

    status.className="error";

    return;

  }


  status.innerText =
    "✅ Login successful!";

  status.className="success";


  showAdmin();

}



/* =========================
   LOGOUT
========================= */

async function logoutAdmin(){

  await supabaseClient.auth.signOut();

  showLogin();

}



/* =========================
   PHOTO PREVIEW
========================= */

const photoInput =
document.getElementById("newsPhoto");

const preview =
document.getElementById("preview");


photoInput.addEventListener(
  "change",
  function(){

    const file =
      this.files[0];

    if(file){

      preview.src =
        URL.createObjectURL(file);

      preview.style.display =
        "block";

    }

  }
);



/* =========================
   UPLOAD NEWS
========================= */

async function uploadNews(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth
  .getSession();


  if(!session){

    alert(
      "पहले Admin Login करें।"
    );

    showLogin();

    return;

  }


  const title =
    document.getElementById("title")
    .value.trim();


  const category =
    document.getElementById("category")
    .value;


  const description =
    document.getElementById("description")
    .value.trim();


  const file =
    document.getElementById("newsPhoto")
    .files[0];


  const status =
    document.getElementById("status");


  if(
    !title ||
    !description ||
    !file
  ){

    status.innerText =
      "⚠️ Headline, जानकारी और Photo जरूरी है।";

    return;

  }


  status.innerText =
    "⏳ Photo upload हो रही है...";


  const fileName =
    Date.now()
    + "-"
    + file.name
        .replace(/\s+/g,"-");


  const {
    data,
    error
  } =
  await supabaseClient.storage
    .from("news-images")
    .upload(
      fileName,
      file
    );


  if(error){

    status.innerText =
      "❌ Photo upload failed: "
      + error.message;

    return;

  }


  const {
    data:urlData
  } =
  supabaseClient.storage
    .from("news-images")
    .getPublicUrl(
      fileName
    );


  const imageUrl =
    urlData.publicUrl;


  status.innerText =
    "⏳ News save हो रही है...";


  const {
    error:newsError
  } =
  await supabaseClient
    .from("news")
    .insert({

      title:title,

      category:category,

      description:description,

      image_url:imageUrl

    });


  if(newsError){

    status.innerText =
      "❌ News save failed: "
      + newsError.message;

    return;

  }


  status.innerText =
    "✅ News successfully published!";


  document.getElementById("title")
    .value="";

  document.getElementById("description")
    .value="";

  document.getElementById("newsPhoto")
    .value="";

  preview.style.display="none";

}



/* START */

checkLogin();
async function loadNews() {

  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    alert("पहले Admin Login करें।");
    return;
  }

  const { data, error } = await supabaseClient
    .from("news")
    .select("*")
    .order("created_at", { ascending: false });

  const list = document.getElementById("newsList");

  if (error) {
    list.innerHTML =
      "<p>❌ News load failed: " + error.message + "</p>";
    return;
  }

  if (!data || data.length === 0) {
    list.innerHTML = "<p>अभी कोई खबर नहीं है।</p>";
    return;
  }

  list.innerHTML = "";

  data.forEach(news => {

    const div = document.createElement("div");

    div.style.cssText = `
      margin-top:15px;
      padding:15px;
      border:1px solid #ddd;
      border-radius:10px;
      background:#fafafa;
    `;

    div.innerHTML = `
      ${
        news.image_url
        ? `<img src="${news.image_url}"
             style="width:100%;max-height:180px;
             object-fit:cover;border-radius:8px;">`
        : ""
      }

      <h3>${escapeHtml(news.title)}</h3>

      <p><b>Category:</b>
        ${escapeHtml(news.category)}
      </p>

      <button onclick="editNews(${news.id})">
        ✏️ Edit
      </button>

      <button
        onclick="deleteNews(${news.id})"
        style="background:#333">
        🗑️ Delete
      </button>
    `;

    list.appendChild(div);
  });
}


async function editNews(id) {

  const { data: news, error } =
    await supabaseClient
      .from("news")
      .select("*")
      .eq("id", id)
      .single();

  if (error) {
    alert("❌ News नहीं मिली");
    return;
  }

  const title = prompt(
    "नई Headline लिखें:",
    news.title
  );

  if (title === null) return;

  const description = prompt(
    "पूरी जानकारी बदलें:",
    news.description
  );

  if (description === null) return;

  const category = prompt(
    "Category बदलें:",
    news.category
  );

  if (category === null) return;

  const { error: updateError } =
    await supabaseClient
      .from("news")
      .update({
        title: title.trim(),
        description: description.trim(),
        category: category.trim()
      })
      .eq("id", id);

  if (updateError) {
    alert(
      "❌ Update failed: " +
      updateError.message
    );
    return;
  }

  alert("✅ News Update हो गई!");

  loadNews();
}


async function deleteNews(id) {

  if (!confirm(
    "⚠️ क्या आप यह खबर Delete करना चाहते हैं?"
  )) {
    return;
  }

  const { error } =
    await supabaseClient
      .from("news")
      .delete()
      .eq("id", id);

  if (error) {
    alert(
      "❌ Delete failed: " +
      error.message
    );
    return;
  }

  alert("🗑️ News Delete हो गई!");

  loadNews();
}


function escapeHtml(text) {

  return String(text || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
        }
</script>

</body>
</html>
