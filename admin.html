<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEWSMASTER Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f3f3f3;
  color:#222;
}

.header{
  background:#111;
  color:white;
  padding:20px;
  text-align:center;
}

.header b{
  color:#e31824;
}

.panel{
  max-width:700px;
  margin:30px auto;
  padding:25px;
  background:white;
  border-radius:15px;
  box-shadow:0 3px 15px #0002;
}

h2{
  margin-top:0;
  border-left:5px solid #e31824;
  padding-left:10px;
}

label{
  display:block;
  margin-top:18px;
  margin-bottom:7px;
  font-weight:bold;
}

input,textarea,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:16px;
}

textarea{
  min-height:130px;
  resize:vertical;
}

button{
  width:100%;
  margin-top:20px;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#e31824;
  color:white;
  font-size:18px;
  font-weight:bold;
}

button:active{
  transform:scale(.98);
}

#preview{
  display:none;
  width:100%;
  max-height:300px;
  object-fit:cover;
  margin-top:15px;
  border-radius:10px;
}

#status{
  margin-top:15px;
  font-weight:bold;
  text-align:center;
}
</style>
</head>

<body>

<header class="header">
  <h1><b>NEWS</b>MASTER</h1>
  <p>Admin News Panel</p>
</header>

<div class="panel">

  <h2>📰 नई खबर जोड़ें</h2>

  <label>खबर की Headline</label>
  <input
    type="text"
    id="title"
    placeholder="खबर की headline लिखें">

  <label>Category</label>
  <select id="category">
    <option value="भारत">भारत</option>
    <option value="दुनिया">दुनिया</option>
    <option value="राजनीति">राजनीति</option>
    <option value="बिजनेस">बिजनेस</option>
    <option value="टेक्नोलॉजी">टेक्नोलॉजी</option>
    <option value="स्पोर्ट्स">स्पोर्ट्स</option>
    <option value="मनोरंजन">मनोरंजन</option>
  </select>

  <label>खबर की पूरी जानकारी</label>
  <textarea
    id="description"
    placeholder="खबर की पूरी जानकारी लिखें"></textarea>

  <label>News Photo</label>
  <input
    type="file"
    id="newsPhoto"
    accept="image/*">

  <img id="preview" alt="Photo Preview">

  <button onclick="uploadNews()">
    📤 खबर Publish करें
  </button>

  <p id="status"></p>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
"https://zdupxbndazidvwrfvrhd.supabase.co";

/*
  यहाँ अपनी Publishable Key डालें।
  Secret Key यहाँ बिल्कुल न डालें।
*/
const SUPABASE_KEY =
"sb_publishable_NSWujieJHbKrNORTwJa9oQ_HJvaqZdq";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const photoInput =
document.getElementById("newsPhoto");

const preview =
document.getElementById("preview");

photoInput.addEventListener("change",function(){

  const file=this.files[0];

  if(file){
    preview.src=URL.createObjectURL(file);
    preview.style.display="block";
  }

});

async function uploadNews(){

  const title =
    document.getElementById("title").value.trim();

  const category =
    document.getElementById("category").value;

  const description =
    document.getElementById("description").value.trim();

  const file =
    document.getElementById("newsPhoto").files[0];

  const status =
    document.getElementById("status");

  if(!title || !description || !file){

    status.innerText =
      "⚠️ Headline, जानकारी और Photo जरूरी है।";

    return;
  }

  status.innerText="⏳ Upload हो रहा है...";

  const fileName =
    Date.now()+"-"+file.name.replace(/\s+/g,"-");

  const {data,error} =
    await supabaseClient.storage
    .from("news-images")
    .upload(fileName,file);

  if(error){

    status.innerText =
      "❌ Photo upload failed: "+error.message;

    return;
  }

  const {data:urlData} =
    supabaseClient.storage
    .from("news-images")
    .getPublicUrl(fileName);

  const imageUrl =
    urlData.publicUrl;

  status.innerText =
    "✅ Photo upload हो गया।";
const { error: newsError } =
  await supabaseClient
  .from("news")
  .insert({
    title: title,
    category: category,
    description: description,
    image_url: imageUrl
  });

if (newsError) {
  status.innerText =
    "❌ News save failed: " + newsError.message;
  return;
}

status.innerText =
  "✅ News successfully published!";
  console.log({
    title,
    category,
    description,
    imageUrl
  });

}

</script>

</body>
</html>
