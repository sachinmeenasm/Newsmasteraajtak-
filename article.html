<!DOCTYPE html>
<html lang="hi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>NEWSMASTER | खबर</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,"Noto Sans Devanagari",sans-serif;
  background:#f4f4f4;
  color:#222;
}

a{
  text-decoration:none;
  color:inherit;
}


/* =========================
   HEADER
========================= */

.header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 8px #0002;
}

.top{
  max-width:1200px;
  margin:auto;
  min-height:75px;
  padding:12px 20px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  font-size:32px;
  font-weight:900;
}

.logo span{
  color:#e31824;
}

.logo b{
  color:#111;
}


/* =========================
   NAV
========================= */

.nav{
  background:#111;
  color:#fff;
  overflow:auto;
  white-space:nowrap;
}

.nav-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
}

.nav a{
  display:block;
  padding:14px 20px;
  font-size:16px;
}

.nav a:hover{
  background:#e31824;
}


/* =========================
   CONTAINER
========================= */

.container{
  max-width:1000px;
  margin:25px auto;
  padding:0 15px;
}


/* =========================
   ACTION BUTTONS
========================= */

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

.action-btn{
  border:0;
  background:#111;
  color:#fff;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-size:15px;
}

.action-btn:hover{
  background:#e31824;
}


/* =========================
   ARTICLE
========================= */

.article{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 2px 12px #0001;
}

.article-image{
  width:100%;
  max-height:550px;
  object-fit:cover;
  display:block;
}

.article-content{
  padding:30px;
}

.category{
  display:inline-block;
  color:#e31824;
  font-weight:bold;
  margin-bottom:12px;
}

.article h1{
  font-size:40px;
  line-height:1.3;
  margin-bottom:15px;
}

.meta{
  color:#777;
  font-size:14px;
  border-bottom:1px solid #eee;
  padding-bottom:18px;
  margin-bottom:20px;
}

.description{
  font-size:20px;
  line-height:1.8;
  white-space:pre-line;
}


/* =========================
   LOADING
========================= */

.loading{
  background:#fff;
  padding:40px;
  text-align:center;
  border-radius:14px;
  font-size:18px;
}


/* =========================
   ERROR
========================= */

.error{
  background:#fff;
  padding:40px 20px;
  text-align:center;
  border-radius:14px;
}

.error h2{
  color:#e31824;
  margin-bottom:10px;
}


/* =========================
   FOOTER
========================= */

.footer{
  margin-top:45px;
  background:#111;
  color:#ddd;
  text-align:center;
  padding:35px 15px;
  line-height:2;
}

.footer b{
  color:#e31824;
}


/* =========================
   MOBILE
========================= */

@media(max-width:800px){

  .top{
    min-height:65px;
    padding:10px 12px;
  }

  .logo{
    font-size:25px;
  }

  .nav a{
    padding:13px 15px;
    font-size:14px;
  }

  .container{
    margin:15px auto;
  }

  .article-content{
    padding:20px;
  }

  .article h1{
    font-size:28px;
  }

  .description{
    font-size:18px;
    line-height:1.7;
  }

  .article-image{
    max-height:400px;
  }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

  <div class="top">

    <a href="index.html" class="logo">
      <span>NEWS</span><b>MASTER</b>
    </a>

  </div>


  <nav class="nav">

    <div class="nav-inner">

      <a href="index.html">
        होम
      </a>

      <a href="index.html">
        ब्रेकिंग न्यूज़
      </a>

      <a href="index.html">
        भारत
      </a>

      <a href="index.html">
        दुनिया
      </a>

      <a href="index.html">
        राजनीति
      </a>

      <a href="index.html">
        बिजनेस
      </a>

      <a href="index.html">
        टेक्नोलॉजी
      </a>

      <a href="index.html">
        स्पोर्ट्स
      </a>

      <a href="index.html">
        मनोरंजन
      </a>

    </div>

  </nav>

</header>


<main class="container">


<!-- =========================
     ACTIONS
========================= -->

<div class="actions">

  <button
    class="action-btn"
    onclick="history.back()"
  >
    ← वापस
  </button>


  <a
    href="index.html"
    class="action-btn"
  >
    🏠 होम
  </a>


  <button
    class="action-btn"
    onclick="shareArticle()"
  >
    🔗 शेयर
  </button>

</div>


<!-- =========================
     ARTICLE AREA
========================= -->

<div id="articleArea">

  <div class="loading">
    📰 खबर लोड हो रही है...
  </div>

</div>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer class="footer">

  <h2>
    <b>NEWS</b>MASTER
  </h2>

  <p>
    आपकी खबर, सबसे पहले।
  </p>

  <p>
    © 2026 NEWSMASTER.
    All Rights Reserved.
  </p>

</footer>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =========================
   SUPABASE
========================= */

const NEWSMASTER_URL =
"https://zdupxbndazidvwrfvrhd.supabase.co";

const NEWSMASTER_KEY =
"sb_publishable_NSWujieJHbKrNORTwJa9oQ_HJvaqZdq";

const newsClient =
supabase.createClient(
  NEWSMASTER_URL,
  NEWSMASTER_KEY
);


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(text){

  return String(text || "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* =========================
   GET NEWS ID
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const newsId =
params.get("id");


/* =========================
   LOAD ARTICLE
========================= */

async function loadArticle(){

  const articleArea =
    document.getElementById(
      "articleArea"
    );


  if(!newsId){

    articleArea.innerHTML = `

      <div class="error">

        <h2>
          ❌ खबर नहीं मिली
        </h2>

        <p>
          इस खबर का ID उपलब्ध नहीं है।
        </p>

      </div>

    `;

    return;

  }


  const {
    data,
    error
  } =
  await newsClient

    .from("news")

    .select("*")

    .eq("id",newsId)

    .single();


  if(error){

    console.error(
      "ARTICLE ERROR:",
      error
    );


    articleArea.innerHTML = `

      <div class="error">

        <h2>
          ❌ खबर लोड नहीं हो सकी
        </h2>

        <p>
          कृपया बाद में फिर कोशिश करें।
        </p>

      </div>

    `;

    return;

  }


  if(!data){

    articleArea.innerHTML = `

      <div class="error">

        <h2>
          ❌ खबर उपलब्ध नहीं है
        </h2>

      </div>

    `;

    return;

  }


  /* =========================
     DATE
  ========================= */

  let dateText = "";

  if(data.created_at){

    const date =
      new Date(data.created_at);

    dateText =
      date.toLocaleString(
        "hi-IN",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      );

  }


  /* =========================
     IMAGE
  ========================= */

  const imageHTML =
    data.image_url

    ?

    `
      <img
        class="article-image"
        src="${escapeHtml(data.image_url)}"
        alt="${escapeHtml(data.title)}"
      >
    `

    :

    "";


  /* =========================
     ARTICLE HTML
  ========================= */

  articleArea.innerHTML = `

    <article class="article">

      ${imageHTML}


      <div class="article-content">

        <div class="category">

          🏷️
          ${escapeHtml(data.category)}

        </div>


        <h1>

          ${escapeHtml(data.title)}

        </h1>


        <div class="meta">

          🕒 Published:
          ${escapeHtml(dateText)}

        </div>


        <div class="description">

          ${escapeHtml(data.description)}

        </div>

      </div>

    </article>

  `;


  /* =========================
     PAGE TITLE
  ========================= */

  document.title =
    data.title +
    " | NEWSMASTER";

}


/* =========================
   SHARE ARTICLE
========================= */

async function shareArticle(){

  const shareData = {

    title:
      document.title,

    text:
      "NEWSMASTER की यह खबर पढ़ें",

    url:
      window.location.href

  };


  try{

    if(
      navigator.share
    ){

      await navigator.share(
        shareData
      );

    }else{

      await navigator.clipboard.writeText(
        window.location.href
      );

      alert(
        "🔗 खबर का लिंक कॉपी हो गया।"
      );

    }

  }catch(error){

    console.log(
      "Share cancelled"
    );

  }

}


/* =========================
   START
========================= */

loadArticle();

</script>


</body>

</html>
